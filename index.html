<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¿Dónde aparqué?</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0B0F14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#0B0F14;color:#E7ECF2;overflow:hidden}
#map{position:fixed;inset:0;z-index:0}
.top{position:fixed;z-index:1000;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;gap:8px}
.glass{background:rgba(17,24,35,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);box-shadow:0 12px 30px -10px rgba(0,0,0,.6)}
.search{flex:1;display:flex;border-radius:16px;overflow:hidden}
.search input{flex:1;min-width:0;border:0;background:none;color:inherit;padding:13px 14px;font-size:16px;outline:none}
.search button{border:0;background:none;color:#FFB454;font-size:18px;padding:0 14px}
.pill{border-radius:16px;border:1px solid rgba(255,255,255,.1);padding:0 12px;font-size:12px;color:#E7ECF2;display:flex;align-items:center;gap:6px}
.led{width:8px;height:8px;border-radius:50%;background:#8B97A6}
.pill.live .led{background:#4ADE80;box-shadow:0 0 8px #4ADE80}.pill.bad .led{background:#FF5C6C;box-shadow:0 0 8px #FF5C6C}
.fabs{position:fixed;z-index:1000;right:12px;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;flex-direction:column;gap:10px}
.fab{width:46px;height:46px;border-radius:14px;font-size:20px;color:#E7ECF2;cursor:pointer;border:1px solid rgba(255,255,255,.1)}
.fab.on{color:#FFB454}
.sheet{position:fixed;z-index:1000;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);max-width:520px;margin:0 auto;border-radius:24px;padding:14px;transform-origin:50% 100%;transform:perspective(900px) rotateX(2.5deg)}
.row{display:flex;gap:8px;align-items:center}
.thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;box-shadow:0 8px 16px -6px #000;transform:perspective(300px) rotateY(-10deg);display:none}
#title{font-weight:800;font-size:16px}#sub{font-size:13px;color:#8B97A6;margin-top:2px;line-height:1.3}
#dist{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-left:auto;text-align:right;white-space:nowrap}#dist small{display:block;font-size:11px;color:#8B97A6;font-weight:500;letter-spacing:0}
.note{width:100%;margin-top:10px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.25);color:inherit;border-radius:12px;padding:11px 12px;font-size:16px;outline:none}.note:focus{border-color:#FFB454}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.b{border:0;border-radius:14px;padding:13px 8px;font-size:14px;font-weight:800;color:#E7ECF2;background:#1d2837;box-shadow:0 4px 0 #0c121a;cursor:pointer;transition:transform .08s,box-shadow .08s}
.b:active{transform:translateY(4px);box-shadow:0 0 0 #0c121a}
.b.main{grid-column:1/-1;background:linear-gradient(135deg,#FFC978,#FFB454);color:#241706;box-shadow:0 4px 0 #a86f22;font-size:16px}
.b.main:active{box-shadow:0 0 0 #a86f22}
#hist{display:none;margin-top:10px;max-height:150px;overflow:auto}
#hist div{padding:8px 4px;border-top:1px solid rgba(255,255,255,.08);font-size:13px;display:flex;justify-content:space-between;cursor:pointer}
#hist span{color:#8B97A6}
#banner{position:fixed;z-index:1001;left:50%;top:calc(env(safe-area-inset-top,0px) + 66px);transform:translateX(-50%);background:#FFB454;color:#241706;font-weight:800;font-size:13px;padding:9px 16px;border-radius:99px;display:none;box-shadow:0 8px 20px -6px #000;white-space:nowrap}
.toast{position:fixed;z-index:2000;left:50%;bottom:40%;transform:translateX(-50%);background:#111823;border:1px solid #26313f;padding:10px 16px;border-radius:14px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;max-width:88%;text-align:center}
.toast.show{opacity:1}
/* marcadores 3D */
.car3d{position:relative;width:56px;height:56px;perspective:200px}
.car3d img{position:absolute;left:0;top:0;width:56px;height:56px;filter:drop-shadow(0 10px 5px rgba(0,0,0,.5));animation:fl 2.4s ease-in-out infinite}
.car3d .g{position:absolute;left:2px;bottom:-6px;width:52px;height:52px;border-radius:50%;background:radial-gradient(rgba(255,70,70,.7),transparent 70%);transform:rotateX(72deg);animation:pu 2.4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px)}}@keyframes pu{50%{transform:rotateX(72deg) scale(1.25);opacity:.5}}
.me{width:18px;height:18px;border-radius:50%;background:#3B82F6;border:3px solid #fff;box-shadow:0 0 0 0 rgba(59,130,246,.6);animation:mp 2s infinite}
@keyframes mp{to{box-shadow:0 0 0 22px rgba(59,130,246,0)}}
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
  <form class="search glass" id="searchForm"><input id="q" placeholder="Buscar calle o lugar…" autocomplete="off"><button aria-label="Buscar">🔍</button></form>
  <button class="pill glass" id="gpsPill"><span class="led"></span><span id="gpsLabel">Activar GPS</span></button>
</div>
<div class="fabs">
  <button class="fab glass" id="satBtn" title="Satélite">🛰️</button>
  <button class="fab glass on" id="followBtn" title="Seguirme">🎯</button>
</div>
<div id="banner">Toca el mapa donde dejaste el coche</div>
<div class="sheet glass">
  <div class="row">
    <img class="thumb" id="thumb">
    <div style="min-width:0"><div id="title">Aún no has marcado tu ix35</div><div id="sub">Pulsa “Aparcado aquí” o márcalo en el mapa.</div></div>
    <div id="dist"></div>
  </div>
  <input class="note" id="note" maxlength="80" placeholder="Nombre de la calle o comentario (ej. C/ Mayor, planta -2)" autocomplete="off">
  <div class="btns">
    <button class="b main" id="hereBtn">📍 Aparcado aquí</button>
    <button class="b" id="pickBtn">🗺️ Marcar en el mapa</button>
    <button class="b" id="photoBtn">📷 Foto del sitio</button>
    <button class="b" id="goBtn" style="display:none">🚶 Cómo llegar</button>
    <button class="b" id="histBtn">🕘 Historial</button>
    <button class="b" id="saveBtn" style="display:none;grid-column:1/-1">💾 Guardar</button>
  </div>
  <div id="hist"></div>
  <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
</div>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

const map=L.map('map',{zoomControl:false,attributionControl:true}).setView(spot?[spot.lat,spot.lng]:[40.4,-3.7],spot?17:6);
const street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'© Esri'});
let isSat=false;
$('satBtn').onclick=()=>{isSat=!isSat;if(isSat){map.removeLayer(street);sat.addTo(map)}else{map.removeLayer(sat);street.addTo(map)}$('satBtn').classList.toggle('on',isSat)};
$('followBtn').onclick=()=>{follow=!follow;$('followBtn').classList.toggle('on',follow);if(follow&&here)map.flyTo([here.lat,here.lng],Math.max(map.getZoom(),17))};
map.on('dragstart',()=>{follow=false;$('followBtn').classList.remove('on')});

const carIcon=L.divIcon({className:'',html:`<div class="car3d"><div class="g"></div><img src="${ICON}"></div>`,iconSize:[56,56],iconAnchor:[28,44]});
const meIcon=L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]});

const dist=(a,b)=>{const R=6371000,r=x=>x*Math.PI/180,s=Math.sin(r(b.lat-a.lat)/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(r(b.lng-a.lng)/2)**2;return 2*R*Math.atan2(Math.sqrt(s),Math.sqrt(1-s))};
let route=null,routeBusy=false,rk='',rfrom=null,rfail=false;
async function fetchRoute(){
  if(!spot||!here||routeBusy)return;
  const k=spot.lat+','+spot.lng;
  if(rk===k&&rfrom&&dist(rfrom,here)<25)return;
  routeBusy=true;rk=k;rfrom={lat:here.lat,lng:here.lng};
  const from=rfrom;
  try{
    const r=await fetch(`https://routing.openstreetmap.de/routed-foot/route/v1/foot/${from.lng},${from.lat};${spot.lng},${spot.lat}?overview=full&geometries=geojson`);
    const d=await r.json();
    if(d.code==='Ok'&&d.routes&&d.routes[0]){const x=d.routes[0];route={k,d:x.distance,t:x.duration,pts:x.geometry.coordinates.map(c=>[c[1],c[0]])};rfail=false}
    else{rfail=true;if(route&&route.k!==k)route=null}
  }catch(e){rfail=true;if(route&&route.k!==k)route=null}
  routeBusy=false;
  if(spot&&here&&spot.lat+','+spot.lng===k)render();
}
const okRoute=()=>route&&spot&&route.k===spot.lat+','+spot.lng;
const fmtD=m=>m<1000?Math.round(m)+' m':(m/1000).toFixed(2)+' km';
const ago=t=>{const m=Math.round((Date.now()-t)/60000);return m<1?'ahora mismo':m<60?'hace '+m+' min':new Date(t).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})};
async function addr(lat,lng){try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`);const d=await r.json(),a=d.address||{};return [a.road,a.house_number,a.suburb||a.city_district,a.city||a.town||a.village].filter(Boolean).join(', ')||d.display_name||''}catch(e){return ''}}

function drawCar(){
  if(carM){map.removeLayer(carM);carM=null}
  if(!spot)return;
  carM=L.marker([spot.lat,spot.lng],{icon:carIcon,draggable:true,zIndexOffset:500}).addTo(map);
  carM.on('dragend',async e=>{const p=e.target.getLatLng();spot.lat=p.lat;spot.lng=p.lng;spot.addr=null;save();render();toast('Posición del coche ajustada')});
}
async function render(){
  const has=!!spot;
  $('goBtn').style.display=has?'block':'none';$('saveBtn').style.display=has?'block':'none';
  $('thumb').style.display=has&&spot.photo?'block':'none';if(has&&spot.photo)$('thumb').src=spot.photo;
  if(!has){$('title').textContent='Aún no has marcado tu ix35';$('sub').textContent='Pulsa “Aparcado aquí” o márcalo en el mapa.';$('dist').innerHTML='';drawLine();return}
  $('title').textContent=spot.note||'Tu ix35 está aquí';
  if(document.activeElement!==$('note'))$('note').value=spot.note||'';
  $('sub').textContent=(spot.addr?spot.addr+' · ':'')+'guardado '+ago(spot.ts);
  if(spot.addr===undefined||spot.addr===null){spot.addr='';addr(spot.lat,spot.lng).then(a=>{spot.addr=a;save();render()})}
  if(here){
    fetchRoute();
    if(okRoute())$('dist').innerHTML=fmtD(route.d)+`<small>≈ ${Math.max(1,Math.round(route.t/60))} min a pie</small>`;
    else{const d=dist(here,spot);$('dist').innerHTML=fmtD(d)+`<small>${rfail?'sin ruta · línea recta':'calculando ruta…'}</small>`}
  }else $('dist').innerHTML='';
  drawLine();
}
function drawLine(){
  if(line){map.removeLayer(line);line=null}
  if(spot&&here){
    const pts=okRoute()?[[here.lat,here.lng],...route.pts]:[[here.lat,here.lng],[spot.lat,spot.lng]];
    line=L.polyline(pts,{color:'#FFB454',weight:4,dashArray:'2 10',lineCap:'round',lineJoin:'round'}).addTo(map);
  }
}
function setSpot(lat,lng){
  const prev=spot?(spot.note||''):'',typed=$('note').value.trim();
  if(spot)hist.unshift(spot);
  spot={lat,lng,ts:Date.now(),photo:null,addr:null,note:typed!==prev?typed:''};
  $('note').value=spot.note;
  save();drawCar();render();map.flyTo([lat,lng],Math.max(map.getZoom(),18));toast('Coche guardado');
}

/* GPS */
function gpsMsg(e){
  if(location.protocol!=='https:'&&location.hostname!=='localhost')return 'El GPS solo funciona con HTTPS. Aloja la app en un sitio con https:// (GitHub Pages, Netlify…).';
  return e.code===1?'Permiso de ubicación bloqueado: actívalo en los ajustes del sitio/navegador y pulsa de nuevo.':e.code===2?'No hay señal GPS ahora mismo. Sal a cielo abierto.':'Tardó demasiado en encontrar señal. Inténtalo otra vez.';
}
function onFix(p){
  here={lat:p.coords.latitude,lng:p.coords.longitude};
  $('gpsPill').className='pill glass live';$('gpsLabel').textContent='en vivo';
  if(!meM){meM=L.marker([here.lat,here.lng],{icon:meIcon,interactive:false}).addTo(map);accC=L.circle([here.lat,here.lng],{radius:p.coords.accuracy,color:'#3B82F6',weight:1,fillOpacity:.1}).addTo(map)}
  else{meM.setLatLng([here.lat,here.lng]);accC.setLatLng([here.lat,here.lng]).setRadius(p.coords.accuracy)}
  if(firstFix&&!spot){map.setView([here.lat,here.lng],17)}firstFix=false;
  if(follow&&spot==null)map.panTo([here.lat,here.lng]);
  render();
}
function startGPS(){
  if(!navigator.geolocation){toast('Este navegador no soporta geolocalización');return}
  $('gpsLabel').textContent='buscando…';
  navigator.geolocation.getCurrentPosition(p=>{
    onFix(p);
    if(watchId==null)watchId=navigator.geolocation.watchPosition(onFix,()=>{},{enableHighAccuracy:true,maximumAge:3000});
  },e=>{$('gpsPill').className='pill glass bad';$('gpsLabel').textContent='GPS denegado';toast(gpsMsg(e))},{enableHighAccuracy:true,timeout:15000});
}
$('gpsPill').onclick=startGPS;
if(navigator.permissions)navigator.permissions.query({name:'geolocation'}).then(r=>{if(r.state==='granted')startGPS()}).catch(()=>{});

/* Acciones */
$('hereBtn').onclick=()=>{if(!here){toast('Activa el GPS o usa “Marcar en el mapa”');startGPS();return}setSpot(here.lat,here.lng)};
$('pickBtn').onclick=()=>{
  picking=!picking;$('banner').style.display=picking?'block':'none';
  if(picking)map.once('click',e=>{picking=false;$('banner').style.display='none';setSpot(e.latlng.lat,e.latlng.lng)});
  else map.off('click');
};
$('note').oninput=()=>{if(!spot)return;spot.note=$('note').value.trim();save();$('title').textContent=spot.note||'Tu ix35 está aquí'};
$('goBtn').onclick=()=>{if(spot)window.open(`https://www.google.com/maps/dir/?api=1&destination=${spot.lat},${spot.lng}&travelmode=walking`,'_blank')};
$('saveBtn').onclick=()=>{
  if(!spot){toast('Primero marca dónde está el coche');return}
  spot.note=$('note').value.trim();spot.ts=Date.now();save();render();
  let ok=false;
  try{const g=JSON.parse(localStorage.getItem('da_spot')||'null');ok=!!g&&g.lat===spot.lat&&g.lng===spot.lng&&(g.note||'')===(spot.note||'')}catch(e){}
  const b=$('saveBtn');
  if(ok){toast(`✓ Guardado: ${spot.lat.toFixed(5)}, ${spot.lng.toFixed(5)}${spot.addr?' · '+spot.addr:''}${spot.note?' · “'+spot.note+'”':''}${spot.photo?' · con foto':''}`);b.textContent='✅ Guardado';setTimeout(()=>b.textContent='💾 Guardar',2000)}
  else toast('⚠️ No se pudo guardar. Revisa el espacio o los permisos del navegador');
};
$('thumb').onclick=()=>map.flyTo([spot.lat,spot.lng],19);
$('photoBtn').onclick=()=>{if(!spot){toast('Primero marca dónde está el coche');return}$('photoInput').click()};
$('photoInput').onchange=e=>{
  const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=ev=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),r=Math.min(1,800/Math.max(im.width,im.height));c.width=im.width*r;c.height=im.height*r;c.getContext('2d').drawImage(im,0,0,c.width,c.height);spot.photo=c.toDataURL('image/jpeg',.6);save();render();toast('Foto añadida')};im.src=ev.target.result};
  rd.readAsDataURL(f);e.target.value='';
};
$('histBtn').onclick=()=>{
  const h=$('hist');if(h.style.display==='block'){h.style.display='none';return}
  h.innerHTML=hist.length?'':'<div><span>Sin aparcamientos anteriores</span></div>';
  hist.forEach((s,i)=>{const d=document.createElement('div');d.innerHTML=`<b>${s.note||s.addr||'Sitio guardado'}</b><span>${ago(s.ts)}</span>`;d.onclick=()=>{if(spot)hist.unshift(spot);hist.splice(hist.indexOf(s),1);spot=s;save();drawCar();render();map.flyTo([s.lat,s.lng],18);h.style.display='none'};h.appendChild(d)});
  h.style.display='block';
};
$('searchForm').onsubmit=async e=>{
  e.preventDefault();const q=$('q').value.trim();if(!q)return;
  try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q)),d=await r.json();
    if(d[0]){follow=false;$('followBtn').classList.remove('on');map.flyTo([+d[0].lat,+d[0].lon],18);$('q').blur()}else toast('No encontré ese lugar')}catch(e){toast('Sin conexión para buscar')}
};

drawCar();render();
if('serviceWorker' in navigator){
  let had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)location.reload();had=true});
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}));
}
</script>
</body>
</html>
